<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map App — Leaflet + OpenStreetMap</title>

  <!-- Leaflet (no API key required) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <form id="search-form" autocomplete="off">
        <input
          id="search-input"
          type="search"
          placeholder="Search a place (e.g. Faisal Mosque, Islamabad)"
          aria-label="Search a place"
          required
        />
        <button id="search-button" type="submit">Search</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </header>

    <div id="map" aria-label="Map"></div>

    <footer class="attribution">
      Search by <a href="https://nominatim.org" target="_blank" rel="noopener">Nominatim</a> ·
      Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
    </footer>
  </div>

  <!-- Generated by serve.py from .env (so future keys stay out of the HTML) -->
  <script src="/config.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
